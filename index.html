<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Tour Arca Joko Dolog</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    .landing-page {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .landing-frame {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      overflow: hidden;
      background: #000;
    }

    .landing-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .start-button {
      position: absolute;
      left: 50%;
      top: 66%;
      transform: translate(-50%, -50%);
      width: 24%;
      height: 12%;
      border: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 18px;
    }

    .start-button:focus-visible {
      outline: 4px solid rgba(255, 255, 255, 0.95);
      outline-offset: 6px;
    }

    @media (max-width: 768px) {
      .start-button {
        width: 34%;
        height: 13%;
        top: 66%;
      }
    }
  </style>
</head>
<body>
  <main class="landing-page">
    <div class="landing-frame">
      <img src="images/landing-joko-dolog.png" alt="Virtual Tour Arca Joko Dolog" />
      <button class="start-button" type="button" aria-label="Mulai Virtual Tour" onclick="window.location.href='tour.html'"></button>
    </div>
  </main>
</body>
</html>
